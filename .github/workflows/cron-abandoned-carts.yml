name: Abandoned cart reminders

# Hits the abandoned-cart cron endpoint hourly.
on:
  schedule:
    - cron: "0 * * * *"      # every hour, on the hour (UTC)
  workflow_dispatch: {}        # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/abandoned-carts
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Repo variable (Settings → Secrets and variables → Actions → Variables).
          # Origin only, no trailing slash, e.g. https://radnar-supply.vercel.app
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL repo variable is not set"; exit 1; }
          curl -fsS --max-time 60 "${SITE_URL}/api/cron/abandoned-carts?key=${CRON_SECRET}"
