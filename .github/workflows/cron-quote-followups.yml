name: Quote follow-ups

# Hits the quote-follow-up cron endpoint once a day.
on:
  schedule:
    - cron: "0 9 * * *"       # 09:00 UTC daily
  workflow_dispatch: {}        # allows manual "Run workflow" from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/cron/quote-followups
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Repo variable (Settings → Secrets and variables → Actions → Variables).
          # Origin only, no trailing slash, e.g. https://radnar-supply.vercel.app
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          test -n "$SITE_URL" || { echo "SITE_URL repo variable is not set"; exit 1; }
          curl -fsS --max-time 60 "${SITE_URL}/api/cron/quote-followups?key=${CRON_SECRET}"
